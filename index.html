<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14181f">
  <title>Doc Scanner PoC · M0 Spike</title>
  <link rel="stylesheet" href="css/spike.css">
</head>
<body>
  <main id="app">
    <!-- หน้าเริ่ม: ตรวจความพร้อมของ browser และรอผู้ใช้แตะ (iOS ต้องเริ่มกล้องจากการแตะ) -->
    <section id="screen-start" class="screen start">
      <div class="start-body">
        <h1>ทดสอบกล้องและการตรวจจับเอกสาร</h1>
        <p class="lead">หน้านี้วัดว่าเครื่องนี้เปิดกล้อง โหลด OpenCV และตรวจจับเอกสารได้เร็วพอหรือไม่</p>
        <ul id="env-checks" class="checks"></ul>
        <p id="start-msg" class="msg" role="alert"></p>
      </div>
      <button id="btn-start" class="btn primary" type="button">เปิดกล้อง</button>
    </section>

    <!-- หน้าสแกน -->
    <section id="screen-scan" class="screen scan" hidden>
      <div id="viewport" class="viewport">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <canvas id="edges" class="edges" aria-hidden="true" hidden></canvas>
        <div id="status-pill" class="pill" role="status">กำลังโหลด OpenCV</div>
      </div>

      <aside id="debug" class="debug">
        <dl id="debug-rows"></dl>
        <button id="btn-copy" class="btn small" type="button">คัดลอกผลทดสอบ</button>
      </aside>

      <footer class="toolbar">
        <select id="camera-select" aria-label="เลือกกล้อง"></select>
        <button id="btn-capture" class="shutter" type="button" aria-label="ถ่ายทดสอบ Warp" disabled></button>
        <button id="btn-debug" class="btn ghost" type="button">ซ่อนค่าวัด</button>
      </footer>
    </section>

    <!-- ผลการถ่ายทดสอบ -->
    <section id="sheet-result" class="sheet" hidden>
      <header class="sheet-head">
        <strong>ผลการปรับมุม</strong>
        <button id="btn-close" class="btn ghost" type="button">กลับไปกล้อง</button>
      </header>
      <div class="sheet-body">
        <img id="result-img" alt="เอกสารหลังปรับมุม">
        <dl id="result-meta" class="meta"></dl>
      </div>
    </section>
  </main>

  <div class="rotate-hint" aria-hidden="true">หมุนเครื่องเป็นแนวตั้งเพื่อสแกน</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
